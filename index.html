    <label>السعر بالدينار<input name="price" type="number" min="0" step="0.5" inputmode="decimal" required></label>
    <label>القسم<select name="cat" id="cat"></select></label>
    <label>اسم المحل<input name="shop" required></label>
    <label>رقم واتساب المحل<input name="wa" type="tel" inputmode="tel" placeholder="07XXXXXXXX"></label>
    <label>المحافظة<select name="gov" id="gov"></select></label>
    <label>المنطقة داخل المحافظة (اختياري)<input name="dist" placeholder="مثلاً: مرج الحمام"></label>
    <label>صور المنتج (حتى 5 صور)<input id="img" type="file" accept="image/*" multiple></label><div class="pv" id="prev"></div>
    <button type="submit">أضف المنتج</button>
    <div class="ok" id="ok" aria-live="polite"></div>
  </form>
  <p class="note">اختر محافظة محلك حتى تنوّر في المدينة. المنتج اللي بتضيفه بيظهر لكل الزبائن مباشرة.</p>
</section>
</main>

</nav>

function showAuth(){var on=!!user;$("af").classList.toggle("hide",on);$("f").classList.toggle("hide",!on);$("who").classList.toggle("hide",!on);if(on)$("whoe").textContent=user.email}
async function authInit(){if(!sb)return;try{var s=await sb.auth.getSession();user=s.data.session?s.data.session.user:null;showAuth();render();sb.auth.onAuthStateChange(function(_e,se){user=se?se.user:null;showAuth();render()})}catch(e){}}
$("af").addEventListener("submit",async function(e){e.preventDefault();if(!sb)return;$("am").textContent="…";var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});$("am").textContent=r.error?"ما زبط الدخول: "+r.error.message:""});
$("up").addEventListener("click",async function(){if(!sb||!$("af").reportValidity())return;$("am").textContent="…";var r=await sb.auth.signUp({email:$("em").value.trim(),password:$("pw").value});$("am").textContent=r.error?"ما انعمل الحساب: "+r.error.message:(r.data.session?"":"تم إنشاء الحساب. إذا وصلك إيميل تأكيد، اضغط عليه ثم سجّل دخول.")});
$("out").addEventListener("click",function(){if(sb)sb.auth.signOut()});
$("list").addEventListener("click",async function(e){var b=e.target.closest(".del");if(!b||!sb||!confirm("حذف هالمنتج؟"))return;var r=await sb.from("products").delete().eq("id",b.dataset.id);if(r.error){alert("ما انحذف: "+r.error.message)}else{loadItems()}});
$("f").addEventListener("submit",async function(e){e.preventDefault();if(!sb||!user)return;var d=new FormData(e.target),btn=e.target.querySelector("button[type=submit]");btn.disabled=true;$("ok").textContent="جاري الحفظ…";
 try{var urls=[];for(var k=0;k<pend.length;k++){var bl=await(await fetch(pend[k])).blob(),path=user.id+"/"+Date.now()+"-"+k+".jpg",up=await sb.storage.from("product-images").upload(path,bl,{contentType:"image/jpeg"});if(up.error)throw up.error;urls.push(sb.storage.from("product-images").getPublicUrl(path).data.publicUrl)}
 var row={name:d.get("name").trim(),price:parseFloat(d.get("price")),category:d.get("cat"),shop:d.get("shop").trim(),governorate:d.get("gov"),district:d.get("dist").trim()||null,whatsapp:waNum(d.get("wa")),images:urls};
 var r=await sb.from("products").insert(row);if(r.error)throw r.error;
 e.target.reset();pend=[];drawPrev();$("ok").textContent="تمت إضافة المنتج، وصار يظهر للجميع.";await loadItems()}catch(x){$("ok").textContent="ما انحفظ: "+(x.message||"خطأ")}
 btn.disabled=false});
function drawPrev(){$("prev").innerHTML=pend.map(function(s,k){return '<img src="'+s+'" data-k="'+k+'" alt="صورة '+(k+1)+'">'}).join("")+(pend.length?'<div class="hint">اضغط على الصورة لحذفها</div>':"")}
$("prev").addEventListener("click",function(e){var k=e.target.dataset&&e.target.dataset.k;if(k!==undefined){pend.splice(+k,1);drawPrev()}});
$("img").addEventListener("change",function(e){Array.prototype.slice.call(e.target.files).slice(0,5-pend.length).forEach(function(f){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var w=Math.min(640,im.width),h=Math.round(im.height*w/im.width),c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);pend.push(c.toDataURL("image/jpeg",0.68));drawPrev()};im.src=r.result};r.readAsDataURL(f)});e.target.value=""});
function route(){var s=location.hash!=="#shop";
 $("v-search").classList.toggle("hide",!s);$("v-shop").classList.toggle("hide",s);
 $("t-search").setAttribute("aria-current",s?"page":"false");$("t-shop").setAttribute("aria-current",s?"false":"page");window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
chips();render();route();loadItems();authInit();
(function(){var c=$("city"),sv=c.querySelector("svg");if(sv){c.scrollLeft=-(sv.getBoundingClientRect().width-c.clientWidth)/2}})();
</script>
</body>
</html>
